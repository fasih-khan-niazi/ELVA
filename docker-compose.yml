services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - elva_mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/elva
    depends_on:
      - mongo
      - ai_service

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./ai_service/.env
    environment:
      BACKEND_URL: http://backend:3000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - backend

volumes:
  elva_mongo_data:
